<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Desert Valley Asphalt logo">
  <!-- v3 "Golden Hour Highway": made for LIGHT backgrounds. Ink + saffron + terracotta. -->
  <!-- sun rising between the peaks -->
  <circle cx="80" cy="66" r="30" fill="#FFB81C"/>
  <!-- two desert peaks: terracotta fill, ink outline -->
  <path d="M14 122 L50 58 L80 96 L110 46 L146 122 Z" fill="#E8603A" stroke="#14283A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- painted road stripe climbing through the gap -->
  <line x1="80" y1="118" x2="80" y2="104" stroke="#FFF9EE" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="96" x2="80" y2="91" stroke="#FFF9EE" stroke-width="5" stroke-linecap="round"/>
  <!-- horizon line -->
  <rect x="18" y="128" width="124" height="5" rx="2.5" fill="#14283A"/>

  <!-- wordmark: live SVG text (Fraunces, falls back to Georgia). OUTLINE THE TEXT BEFORE PRINT / SIGNAGE / DECALS. -->
  <text x="184" y="76" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="44" letter-spacing="0.2" fill="#14283A">DESERT VALLEY</text>
  <text x="184" y="123" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic"
        font-size="44" letter-spacing="0.5" fill="#C8431D">Asphalt</text>
  <rect x="186" y="134" width="150" height="5" rx="2.5" fill="#FFB81C"/>
</svg>
